name: Weekly Security Scan

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  scan-frontend-image:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner | lower }}/studio-production-pipeline-frontend:latest
          format: sarif
          output: trivy-frontend-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload frontend image SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend-image-results.sarif
          category: trivy-frontend-image

      - name: Upload frontend image scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-image-scan
          path: trivy-frontend-image-results.sarif
          if-no-files-found: ignore

  scan-backend-image:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner | lower }}/studio-production-pipeline-backend:latest
          format: sarif
          output: trivy-backend-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload backend image SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend-image-results.sarif
          category: trivy-backend-image

      - name: Upload backend image scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-image-scan
          path: trivy-backend-image-results.sarif
          if-no-files-found: ignore

  scan-filesystem:
    name: Scan Filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload filesystem SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload filesystem scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-scan
          path: trivy-fs-results.sarif
          if-no-files-found: ignore
