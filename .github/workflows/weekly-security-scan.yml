name: Weekly Security Scan

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write
  issues: write

env:
  REGISTRY: ghcr.io

jobs:
  scan-frontend-image:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner | lower }}/studio-production-pipeline-frontend:latest
          format: sarif
          output: trivy-frontend-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload frontend image SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend-image-results.sarif
          category: trivy-frontend-image

      - name: Upload frontend image scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-image-scan
          path: trivy-frontend-image-results.sarif
          if-no-files-found: ignore

  scan-backend-image:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner | lower }}/studio-production-pipeline-backend:latest
          format: sarif
          output: trivy-backend-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload backend image SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend-image-results.sarif
          category: trivy-backend-image

      - name: Upload backend image scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-image-scan
          path: trivy-backend-image-results.sarif
          if-no-files-found: ignore

  scan-filesystem:
    name: Scan Filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload filesystem SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload filesystem scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-scan
          path: trivy-fs-results.sarif
          if-no-files-found: ignore

  notify:
    name: Notify on Vulnerabilities
    runs-on: ubuntu-latest
    needs: [scan-frontend-image, scan-backend-image, scan-filesystem]
    if: failure()
    timeout-minutes: 5

    steps:
      - name: Create GitHub issue for vulnerabilities
        uses: actions/github-script@v7
        env:
          FRONTEND_RESULT: ${{ needs.scan-frontend-image.result }}
          BACKEND_RESULT: ${{ needs.scan-backend-image.result }}
          FILESYSTEM_RESULT: ${{ needs.scan-filesystem.result }}
        with:
          script: |
            const frontendResult = process.env.FRONTEND_RESULT;
            const backendResult = process.env.BACKEND_RESULT;
            const filesystemResult = process.env.FILESYSTEM_RESULT;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().split('T')[0];

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
            });
            const duplicate = openIssues.find(issue => issue.title.includes('Weekly scan found CRITICAL/HIGH vulnerabilities'));
            if (duplicate) {
              core.info(`Open security issue already exists: #${duplicate.number}`);
              return;
            }

            const title = `[Security] Weekly scan found CRITICAL/HIGH vulnerabilities — ${today}`;
            const body = [
              '🚨 Weekly security scan detected CRITICAL/HIGH vulnerabilities.',
              '',
              '| Scan | Result |',
              '|------|--------|',
              `| Frontend image | ${frontendResult} |`,
              `| Backend image | ${backendResult} |`,
              `| Filesystem | ${filesystemResult} |`,
              '',
              `[View workflow run](${runUrl})`,
            ].join('\n');

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'trivy', 'automated'],
              });
            } catch (err) {
              if (err.status === 422) {
                core.warning('Labels may not exist; retrying with only "security" label');
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['security'],
                });
              } else {
                throw err;
              }
            }

      - name: Send Slack alert
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 *Weekly Security Scan Alert*\nCRITICAL/HIGH vulnerabilities detected in *${{ github.repository }}*.\n\n• Frontend image scan: ${{ needs.scan-frontend-image.result }}\n• Backend image scan: ${{ needs.scan-backend-image.result }}\n• Filesystem scan: ${{ needs.scan-filesystem.result }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
