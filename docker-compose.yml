services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./videos:/app/videos:ro
    environment:
      - APP_NAME=Studio Production Pipeline API
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001
      - API_PREFIX=/api
      - YOUTUBE_CLIENT_SECRETS=/app/secrets/client_secret.json
      - VIMEO_ACCESS_TOKEN=${VIMEO_ACCESS_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8001/api
    ports:
      - "3001:80"
    depends_on:
      - backend
